<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Klaster sirlari — QR kvest</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f5fb;color:#152e4d;margin:0;padding:18px}main{max-width:680px;margin:auto}header{padding:27px 20px;border-radius:22px;background:linear-gradient(135deg,#15549a,#2684ca);color:#fff;text-align:center}h1{font-size:30px;margin:0 0 8px}header p{margin:0;opacity:.95}section{background:white;border-radius:20px;margin:20px 0;padding:25px;box-shadow:0 9px 32px #123d7020}.tag{display:inline-block;color:#19548b;background:#e7f2ff;border-radius:50px;padding:8px 14px;font-weight:bold}.hint{background:#fff4da;padding:16px;border-radius:12px;margin-top:16px}button{width:100%;background:#176ac4;border:0;border-radius:12px;color:white;padding:18px;font-size:21px;font-weight:bold;cursor:pointer}.hidden{display:none}li{font-size:19px;line-height:1.6;margin-bottom:15px}small{color:#5d7085}footer{text-align:center;color:#52687e;margin-top:24px}</style></head><body><main><header><h1>KLASTER SIRLARI</h1><p>2-BT-23 • 4 jamoa • QR kvest</p></header><section><div id="team" class="tag"></div><h2 id="title"></h2><p>Topshiriq matnini ko‘rish uchun quyidagi tugmani bosing. <b>Javoblar berilmaydi.</b></p><button id="open">🔓 Shartni ochish</button><div id="content" class="hidden"><ol id="questions"></ol><div class="hint"><b>Vazifa:</b> Savollarga jamoa bo‘lib javob bering, natijani o‘qituvchiga himoya qiling.</div></div></section><footer>Klaster metodi • Kvest mashg‘uloti</footer></main><script>const tasks={1:{name:"Bilimdonlar",title:"Klaster metodining nazariy asoslari",q:["Klaster metodiga ilmiy-pedagogik ta’rif bering.","Markaziy tushuncha, tarmoqlash va tizimlashtirish o‘rtasidagi bog‘lanishni izohlang.","Klaster metodining boshlang‘ich sinfdagi uchta afzalligini misollar bilan tushuntiring."]},2:{name:"Metodistlar",title:"Klaster metodini tashkil etish bosqichlari",q:["Klaster tuzishning oltita asosiy bosqichini tartib bilan ayting.","Nima uchun dastlabki bilimlarni faollashtirish muhim?","3-sinf ona tili darsida klaster metodini qo‘llash uchun qisqa reja tuzing."]},3:{name:"Ijodkorlar",title:"Klaster va mantiqiy tafakkur",q:["Tahlil, sintez va taqqoslash tushunchalariga qisqa ta’rif bering.","Klasterda noto‘g‘ri mantiqiy bog‘lanishni aniqlashning ikki usulini ayting.","«O‘simliklar» mavzusida kamida beshta to‘g‘ri bog‘langan tushunchali mini-klaster chizing."]},4:{name:"Innovatorlar",title:"Boshlang‘ich ta’lim fanlarida klaster",q:["Ona tili, matematika va tabiiy fan darslarida klaster qanday qo‘llanadi?","1-sinf o‘quvchisiga mos sodda klaster va 4-sinfga mos murakkab klasterni taqqoslang.","Fanlararo integratsiyaga oid bitta klaster yarating va pedagogik foydasini izohlang."]}};const id=new URLSearchParams(location.search).get("j");const t=tasks[id];if(!t){document.querySelector("section").innerHTML="<h2>Jamoa raqami topilmadi</h2><p>QR kodni qayta skanerlang.</p>"}else{document.getElementById("team").textContent=id+"-jamoa — "+t.name;document.getElementById("title").textContent=t.title;document.getElementById("questions").innerHTML=t.q.map(q=>"<li>"+q+"</li>").join("");document.getElementById("open").addEventListener("click",()=>{const e=document.getElementById("content");const on=e.classList.toggle("hidden");document.getElementById("open").textContent=on?"🔓 Shartni ochish":"🔒 Shartni yopish"})}</script></body></html>
