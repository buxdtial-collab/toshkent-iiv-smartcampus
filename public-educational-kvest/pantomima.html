<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantomima — QR kvest</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(130deg,#eaf4ff,#fff4e2);color:#173c63}.card{width:min(100%,730px);background:white;border:4px solid #e9c469;border-radius:26px;box-shadow:0 14px 40px #1b47751e;text-align:center;padding:32px 22px}.eyebrow{color:#2866a4;font-weight:800;letter-spacing:1px}h1{font-size:clamp(30px,6vw,43px);margin:10px 0}.team{font-size:19px;color:#507399;font-weight:700}.rule{font-size:clamp(19px,4vw,26px);font-weight:700;line-height:1.4;margin:25px 0;background:#fff2d2;border-radius:16px;padding:18px}.category{font-size:21px;font-weight:800;margin:20px 0;color:#185c9d}button{border:0;border-radius:15px;padding:19px 25px;font-weight:800;background:#2369be;color:#fff;font-size:21px;cursor:pointer;width:100%}.word{display:none;background:#e6f6eb;border:2px solid #5ba87a;border-radius:17px;margin:22px 0;padding:25px;font-size:clamp(32px,7vw,50px);font-weight:900}.foot{color:#5d7186;font-size:15px;margin-top:18px}</style></head><body><main class="card"><div class="eyebrow">KLASTER SIRLARI • 3-BOSQICH</div><h1>🎭 PANTOMIMA</h1><div class="team" id="team"></div><div class="category" id="category"></div><div class="rule">Jamoadan 1 nafar talaba doskaga chiqsin. Ekranda ochilgan so‘zni <u>gapirmasdan va ovoz chiqarmasdan</u> harakatlar bilan ko‘rsatsin. Jamoasi topishi kerak!</div><button id="btn">🔓 SO‘ZNI OCHISH</button><div id="word" class="word"></div><div class="foot">Vaqt: 60 soniya. Telefon ekranini faqat ishora ko‘rsatuvchi talaba ko‘rsin.</div></main><script>const a={1:{team:"1-jamoa — Bilimdonlar",category:"O‘quv qurollari",words:["Qalam","Ruchka","Daftar","Chizg‘ich","O‘chirg‘ich","Qaychi"]},2:{team:"2-jamoa — Metodistlar",category:"Hayvonlar",words:["Mushuk","Quyon","Fil","Arslon","Maymun","Qush"]},3:{team:"3-jamoa — Ijodkorlar",category:"Kasblar",words:["O‘qituvchi","Shifokor","Oshpaz","Tikuvchi","Quruvchi","Sartarosh"]},4:{team:"4-jamoa — Innovatorlar",category:"Oshxona jihozlari",words:["Qoshiq","Choynak","Tova","Qirg‘ich","Likopcha","Kapgir"]}};const id=new URLSearchParams(location.search).get("j"),d=a[id];if(!d){document.querySelector(".card").innerHTML="<h1>Jamoa aniqlanmadi</h1><p>QR kodni qayta skanerlang.</p>"}else{document.querySelector("#team").textContent=d.team;document.querySelector("#category").textContent="Mavzu: "+d.category;let count=0;const btn=document.querySelector("#btn"),w=document.querySelector("#word");btn.onclick=()=>{w.textContent=d.words[count%d.words.length];w.style.display="block";btn.textContent="➡️ KEYINGI SO‘Z";count++}};</script></body></html>
